<!DOCTYPE html>
<html lang="sk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <title>Rozpis služieb - Charita sv. Alžbety</title>
    <link rel="stylesheet" href="style.css">
    <style>
      /* --- PRIHLÁSENIE --- */
      .prihlasenie {
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 20px;
        box-sizing: border-box;
      }
      .prihlasenie-karta {
        background: white;
        border-radius: 16px;
        box-shadow: 0 2px 12px rgba(0,0,0,0.08);
        padding: 32px 28px 28px;
        width: 100%;
        max-width: 340px;
        text-align: center;
        font-family: Arial, sans-serif;
      }
      .prihlasenie-karta img { height: 48px; width: auto; }
      .prihlasenie-karta h2 {
        color: #b5651d;
        font-size: 18px;
        margin: 12px 0 4px;
      }
      .prihlasenie-karta p {
        color: #6b7280;
        font-size: 14px;
        margin: 0 0 20px;
      }
      .prihlasenie-karta input {
        width: 100%;
        box-sizing: border-box;
        font-size: 26px;
        letter-spacing: 0.4em;
        text-align: center;
        padding: 12px;
        border: 2px solid #d1d5db;
        border-radius: 12px;
        outline: none;
      }
      .prihlasenie-karta input:focus { border-color: #b5651d; }
      .prihlasenie-karta button {
        width: 100%;
        margin-top: 14px;
        padding: 13px;
        border: none;
        border-radius: 12px;
        background: #b5651d;
        color: white;
        font-size: 16px;
        font-weight: bold;
        cursor: pointer;
      }
      .prihlasenie-karta button:disabled { opacity: 0.6; cursor: wait; }
      .chyba {
        color: #c0392b;
        font-size: 14px;
        min-height: 20px;
        margin-top: 12px;
      }

      /* --- HORNÝ RIADOK S MESIACOM --- */
      .horny-riadok {
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 12px;
        padding: 10px;
        font-size: 14px;
        font-family: Arial, sans-serif;
      }
      .horny-riadok select {
        padding: 6px 10px;
        border-radius: 8px;
        border: 1px solid #d1d5db;
        font-size: 14px;
      }
      .odhlasit {
        background: none;
        border: 1px solid #d1d5db;
        border-radius: 8px;
        padding: 6px 12px;
        font-size: 13px;
        color: #6b7280;
        cursor: pointer;
      }
      .header-right { text-align: right; font-size: 13px; color: #6b7280; }
      .nacitavam {
        text-align: center;
        color: #6b7280;
        padding: 40px 10px;
        font-family: Arial, sans-serif;
      }
      [hidden] { display: none !important; }
    </style>
    <style>
@media (max-width: 700px) {
  header { display:flex !important; flex-wrap:wrap; justify-content:space-between; align-items:center; gap:6px; padding:10px 14px !important; }
  .logo-container span { font-size:14px !important; white-space:nowrap; }
  .logo-img { height:30px !important; width:auto; }
  #kto { font-size:13px !important; white-space:nowrap; }
  #nadpis { order:3; width:100%; text-align:center; font-size:18px !important; line-height:1.3 !important; margin:4px 0 0 !important; }
}
.l, .č, .p, .j, .med, .moz, .kin, .h { color: #ffffff !important; }
</style>
</head>
<body>

<!-- ===== PRIHLÁSENIE ===== -->
<div class="prihlasenie" id="prihlasenie" hidden>
  <div class="prihlasenie-karta">
    <img src="logo.png.jpg" alt="Logo Charita">
    <h2>Charita sv. Alžbety</h2>
    <p>Zadaj svoj PIN</p>
    <input id="pinInput" type="password" inputmode="numeric" autocomplete="off" maxlength="10">
    <button id="pinBtn" type="button">Prihlásiť</button>
    <div class="chyba" id="pinChyba"></div>
  </div>
</div>

<!-- ===== HLAVNÁ STRÁNKA ===== -->
<div id="obsah" hidden>
  <div class="horny-riadok">
    <label for="mesiacSelect">Mesiac:</label>
    <select id="mesiacSelect"></select>
    <button class="odhlasit" id="odhlasitBtn" type="button">Odhlásiť</button>
  </div>

  <!-- HLAVIČKA -->
  <header>
    <div class="logo-container">
      <img src="logo.png.jpg" alt="Logo Charita" class="logo-img">
      <span>Charita sv. Alžbety</span>
    </div>
    <h1 id="nadpis">ROZPIS SLUŽIEB</h1>
    <div class="header-right" id="kto"></div>
  </header>

  <div class="table-container" tabindex="0" id="rozpis">
    <div class="nacitavam">Načítavam rozpis…</div>
  </div>

  <div class="mriezka" id="mriezka"></div>
</div>

<script>
  // Adresa pomocníka (Google Apps Script)
  const API = "https://script.google.com/macros/s/AKfycbzeTbJuIlv-giijsjahwL5R3rIlcwvecLA3GIjYrsgxLJGyaDci936SQ__Fk5nbJ5Dv/exec";
  const PIN_KLUC = "charita_pin";
  const MESIACE = ["JANUÁR","FEBRUÁR","MAREC","APRÍL","MÁJ","JÚN","JÚL","AUGUST","SEPTEMBER","OKTÓBER","NOVEMBER","DECEMBER"];

  let PIN = "";
  try { PIN = localStorage.getItem(PIN_KLUC) || ""; } catch(e) {}

  function todayKey(){ return new Date().toISOString().slice(0,10); }

  async function api(akcia, data){
    const telo = Object.assign({ akcia: akcia, pin: PIN }, data || {});
    const res = await fetch(API, { method: "POST", body: JSON.stringify(telo) });
    return res.json();
  }

  function ukazPrihlasenie(sprava){
    document.getElementById("obsah").hidden = true;
    document.getElementById("prihlasenie").hidden = false;
    document.getElementById("pinChyba").textContent = sprava || "";
    document.getElementById("pinInput").value = "";
    document.getElementById("pinInput").focus();
  }

  function odhlas(sprava){
    PIN = "";
    try { localStorage.removeItem(PIN_KLUC); } catch(e) {}
    ukazPrihlasenie(sprava);
  }

  async function prihlas(){
    const input = document.getElementById("pinInput");
    const btn = document.getElementById("pinBtn");
    const pin = input.value.trim();
    if(!pin){ document.getElementById("pinChyba").textContent = "Zadaj PIN."; return; }
    btn.disabled = true;
    document.getElementById("pinChyba").textContent = "Overujem…";
    PIN = pin;
    try {
      const r = await api("login");
      if(!r.ok){
        PIN = "";
        document.getElementById("pinChyba").textContent = r.chyba || "Nesprávny PIN";
        input.value = "";
        input.focus();
      } else {
        try { localStorage.setItem(PIN_KLUC, pin); } catch(e) {}
        spusti(r);
      }
    } catch(e){
      PIN = "";
      document.getElementById("pinChyba").textContent = "Nepodarilo sa spojiť. Skontroluj internet a skús znova.";
    }
    btn.disabled = false;
  }

  document.getElementById("pinBtn").addEventListener("click", prihlas);
  document.getElementById("pinInput").addEventListener("keydown", e => { if(e.key === "Enter") prihlas(); });
  document.getElementById("odhlasitBtn").addEventListener("click", () => odhlas(""));

  /* ===== ROZPIS ===== */
  async function nacitajRozpis(mesiac){
    const box = document.getElementById("rozpis");
    box.innerHTML = '<div class="nacitavam">Načítavam rozpis…</div>';
    const r = await api("rozpis", { mesiac: mesiac || "" });
    if(!r.ok){ if(r.zlyPin) return odhlas("PIN už neplatí, zadaj ho znova."); box.innerHTML = '<div class="nacitavam">' + (r.chyba || "Chyba") + '</div>'; return; }

    // výber mesiacov
    const sel = document.getElementById("mesiacSelect");
    sel.innerHTML = (r.mesiace || []).map(ym => {
      const [y,m] = ym.split("-");
      const nazov = MESIACE[parseInt(m,10)-1];
      return `<option value="${ym}">${nazov.charAt(0) + nazov.slice(1).toLowerCase()} ${y}</option>`;
    }).join("");
    if(r.mesiac) sel.value = r.mesiac;

    if(!r.mesiac){
      document.getElementById("nadpis").textContent = "ROZPIS SLUŽIEB";
      box.innerHTML = '<div class="nacitavam">Rozpis zatiaľ nie je nahraný.</div>';
      return;
    }
    const [y,m] = r.mesiac.split("-");
    document.getElementById("nadpis").textContent = "ROZPIS SLUŽIEB: " + MESIACE[parseInt(m,10)-1] + " " + y;

    // zo súboru zoberieme len tabuľku (funguje aj s celou starou stránkou)
    const doc = new DOMParser().parseFromString(r.html, "text/html");
    const tabulka = doc.querySelector("table");
    box.innerHTML = tabulka ? tabulka.outerHTML : r.html;
  }

  document.getElementById("mesiacSelect").addEventListener("change", e => nacitajRozpis(e.target.value));

  /* ===== KARTY OPATROVATELIEK ===== */
  function stavZTelefonu(meno){
    // kým dochádzka neposiela záznamy pomocníkovi, berieme stav aj z tohto zariadenia
    try {
      const vsetko = JSON.parse(localStorage.getItem("dochadzka_" + meno.replace(/\s+/g, "_"))) || {};
      const dnes = vsetko[todayKey()] || [];
      return dnes.length ? dnes[dnes.length - 1].type : null;
    } catch(e){ return null; }
  }

  function escapeHtml(t){
    return String(t).replace(/[&<>"']/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));
  }

  async function nacitajKarty(){
    const r = await api("karty", { dnes: todayKey() });
    if(!r.ok){ if(r.zlyPin) return odhlas("PIN už neplatí, zadaj ho znova."); return; }
    const karty = (r.karty || []).slice()
      .sort((a,b) => a.meno.localeCompare(b.meno, "sk"));
    document.getElementById("mriezka").innerHTML = karty.map(k => {
      const stav = k.stav || stavZTelefonu(k.meno);
      const aktivny = stav === "prichod" ? 0 : (stav === "prestup" ? 1 : 2);
      const bodka = (farba, i) =>
        `<span class="bodka ${farba} ${i === aktivny ? "aktivna" : "tlmena"}"></span>`;
      return `<div class="sluzba ${escapeHtml(k.farba)}">
        <span class="meno">${escapeHtml(k.meno)}</span>
        <div class="bodky">${bodka("zelena",0)}${bodka("oranzova",1)}${bodka("cervena",2)}</div>
        <a class="rozpis" href="Aplikacie/dochadzka.html?meno=${encodeURIComponent(k.meno)}">Detailne informácie</a>
      </div>`;
    }).join("");
  }

  /* ===== ŠTART ===== */
  let interval = null;
  function spusti(login){
    document.getElementById("prihlasenie").hidden = true;
    document.getElementById("obsah").hidden = false;
    document.getElementById("kto").textContent = login.meno;
    nacitajRozpis("");
    nacitajKarty();
    clearInterval(interval);
    interval = setInterval(nacitajKarty, 60000);
  }

  (async function(){
    if(!PIN){ ukazPrihlasenie(""); return; }
    try {
      const r = await api("login");
      if(r.ok) spusti(r);
      else odhlas(r.zlyPin ? "" : (r.chyba || ""));
    } catch(e){
      ukazPrihlasenie("Nepodarilo sa spojiť. Skontroluj internet a skús znova.");
    }
  })();
</script>
</body>
</html>
